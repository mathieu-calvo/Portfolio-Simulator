name: Supabase keepalive

on:
  schedule:
    # Daily at 09:00 UTC. Daily (not Mon/Thu) so a single GitHub-skipped
    # scheduled run leaves a ~2-day gap, well under Supabase's 7-day pause threshold.
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run SELECT 1 against Supabase
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set" >&2
            exit 1
          fi
          psql "$DATABASE_URL" -c "SELECT 1;"

      # Supabase's auto-pause detector watches the API surface (PostgREST etc.),
      # not raw Postgres connections, and a read-only GET does not count as
      # activity (confirmed: project paused Jul 2026 despite green GET pings).
      # A WRITE through PostgREST generates WAL activity the detector registers.
      - name: Upsert heartbeat via Supabase REST (write = real activity)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "SUPABASE_URL or SUPABASE_ANON_KEY secret is not set" >&2
            exit 1
          fi
          curl -fsS -X POST \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            "$SUPABASE_URL/rest/v1/keepalive_heartbeat" \
            -d "{\"id\":1,\"pinged_at\":\"$(date -u +%FT%TZ)\"}"
